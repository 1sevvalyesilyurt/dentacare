services:
  # ─── Application ────────────────────────────────────────────────────────────
  dentacare:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Override to store SQLite in the mounted volume
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/DentalClinic.db"
      # Set a strong password — override via .env file or shell export
      SeedSettings__DefaultSecretaryPassword: ${SECRETARY_PASSWORD:-ChangeMe@2026!}
    volumes:
      - dentacare-data:/app/data
      - dentacare-logs:/app/logs
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Prometheus (metrics scraper) ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    restart: unless-stopped

  # ─── Grafana (dashboards) ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  dentacare-data:
  dentacare-logs:
  prometheus-data:
  grafana-data:
