global:
  resolve_timeout: 5m
  # Set SLACK_WEBHOOK_URL env variable or replace the placeholder below
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-default

  routes:
    - match:
        severity: critical
      receiver: slack-critical
      repeat_interval: 1h

receivers:
  - name: slack-default
    slack_configs:
      - channel: '#dentacare-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  - name: slack-critical
    slack_configs:
      - channel: '#dentacare-alerts'
        send_resolved: true
        title: '🚨 [CRITICAL] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'danger'

inhibit_rules:
  # Suppress warnings when a critical alert is already firing for the same service
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['job']
