name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # create GitHub Release
  packages: write    # push to GHCR
  checks: write

jobs:
  # ─── Run full test suite before releasing ────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet build --configuration Release

      - run: dotnet test DentalClinic.Tests --no-build --configuration Release
      - run: dotnet test DentalClinic.IntegrationTests --no-build --configuration Release

  # ─── Build & push Docker image to GHCR ───────────────────────────────────────
  docker-publish:
    name: 🐳 Publish Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${{ github.repository }}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Create GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: 📦 GitHub Release
    runs-on: ubuntu-latest
    needs: docker-publish

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ## Quick Start

            ```bash
            SECRETARY_PASSWORD=YourPassword docker compose up -d
            ```

            See [README](https://github.com/${{ github.repository }}#readme) for full setup instructions.
