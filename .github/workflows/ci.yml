name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR to avoid queued builds
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/test-reporter requires checks:write to create PR check annotations.
# contents:read is the safe minimum for private repos.
permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_VERSION: '9.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  # ─── Job 1: Release build + vulnerability scan ────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable" vuln.txt; then
            echo "::error::Vulnerable NuGet packages detected — see vuln.txt"
            exit 1
          fi
          echo "✅ No known vulnerabilities found."

  # ─── Job 2: Unit + Integration tests (xUnit, in-memory DB) ───────────────
  unit-integration:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore & build
        run: dotnet build --configuration Debug

      - name: Unit tests — DentalClinic.Tests (55 tests)
        run: |
          dotnet test DentalClinic.Tests \
            --no-build \
            --configuration Debug \
            --logger "trx;LogFileName=unit.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage"

      - name: Integration tests — DentalClinic.IntegrationTests (150 tests)
        run: |
          dotnet test DentalClinic.IntegrationTests \
            --no-build \
            --configuration Debug \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit & Integration Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload raw TRX artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit-integration
          path: TestResults/
          retention-days: 14

  # ─── Job 3: Playwright E2E tests (real browser, real SQLite) ─────────────
  playwright:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: build

    env:
      # Test-environment credentials — not production secrets
      SeedSettings__DefaultSecretaryPassword: Admin@123
      SeedSettings__PlaywrightDoctorPassword: Doctor@123!
      SeedSettings__PlaywrightCustomerPassword: Customer@123!
      # Force headless Chromium
      BROWSER: chromium

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Bump version when upgrading Microsoft.Playwright.NUnit package
          key: playwright-${{ runner.os }}-1.49.0

      - name: Restore & build
        run: dotnet build --configuration Debug

      - name: Install Playwright Chromium + OS dependencies
        run: |
          pwsh DentalClinic.PlaywrightTests/bin/Debug/net9.0/playwright.ps1 \
            install chromium --with-deps

      - name: Run Playwright E2E tests (58 tests)
        run: |
          dotnet test DentalClinic.PlaywrightTests \
            --no-build \
            --configuration Debug \
            --logger "trx;LogFileName=playwright.trx" \
            --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright E2E Test Results
          path: TestResults/playwright.trx
          reporter: dotnet-trx

      - name: Upload raw TRX artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-playwright
          path: TestResults/
          retention-days: 14

      # Playwright saves traces to this folder when a test fails
      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: playwright-traces/
          if-no-files-found: ignore
          retention-days: 7

  # ─── Job 4: Docker image build validation ────────────────────────────────
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dentacare:${{ github.sha }}
          # BuildKit cache — speeds up repeated builds on the same runner
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 5: Staging smoke test (Docker + k6, main branch only) ───────────
  staging-smoke:
    name: 🏗️ Staging Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    env:
      SECRETARY_PASSWORD: ${{ secrets.SECRETARY_PASSWORD || 'Admin@123' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: dentacare:staging
          cache-from: type=gha

      - name: Start application (no monitoring stack needed)
        run: |
          docker run -d \
            --name dentacare-staging \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e SeedSettings__DefaultSecretaryPassword=${{ env.SECRETARY_PASSWORD }} \
            dentacare:staging

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' dentacare-staging 2>/dev/null || echo "starting")
            if curl --silent --fail http://localhost:8080/health 2>/dev/null; then
              echo "✅ App is healthy after $((i*5))s"
              exit 0
            fi
            echo "⏳ Waiting... (${i}/24) — container status: $STATUS"
            sleep 5
          done
          echo "❌ App failed to become healthy within 120s"
          docker logs dentacare-staging
          exit 1

      - name: Run k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtests/smoke.js
          flags: --env BASE_URL=http://localhost:8080

      - name: Stop container
        if: always()
        run: docker rm -f dentacare-staging || true

  # ─── Job 6: Load test (k6, release tags only) ────────────────────────────
  load-test:
    name: ⚡ Load Test
    runs-on: ubuntu-latest
    needs: [staging-smoke]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: dentacare:loadtest
          cache-from: type=gha

      - name: Start application
        run: |
          docker run -d \
            --name dentacare-loadtest \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e SeedSettings__DefaultSecretaryPassword=LoadTest@123! \
            dentacare:loadtest
          sleep 30

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtests/load.js
          flags: --env BASE_URL=http://localhost:8080

      - name: Stop container
        if: always()
        run: docker rm -f dentacare-loadtest || true
