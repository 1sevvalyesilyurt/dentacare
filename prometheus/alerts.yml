groups:
  - name: dentacare
    interval: 30s
    rules:
      # ─── Availability ──────────────────────────────────────────────────────
      - alert: ServiceDown
        expr: up{job="dentacare"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DentaCare is unreachable"
          description: "Prometheus cannot scrape the /metrics endpoint. The app may be crashed or restarting."

      # ─── Error rate ────────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          rate(http_requests_received_total{code=~"5.."}[5m])
          /
          rate(http_requests_received_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are returning 5xx errors."

      # ─── Latency ───────────────────────────────────────────────────────────
      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 response time > 2 s"
          description: "The 95th percentile response time is {{ $value | humanizeDuration }}."

      - alert: VerySlowRequests
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "p95 response time > 5 s"
          description: "The 95th percentile response time is {{ $value | humanizeDuration }}. Immediate action required."

      # ─── Traffic ───────────────────────────────────────────────────────────
      - alert: HighRequestVolume
        expr: rate(http_requests_received_total[1m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Request rate above 100 req/s"
          description: "Current rate: {{ $value | humanize }} req/s. Consider scaling."
